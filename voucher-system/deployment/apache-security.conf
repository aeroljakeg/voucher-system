<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

<DirectoryMatch "^/var/www/html/(config|database|deployment|includes|services)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "(?i)(^\.|\.sql$|\.md$|\.log$|^Dockerfile$)">
    Require all denied
</FilesMatch>

<Directory /var/www/html/uploads>
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
